<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Society</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="dot" id="live-dot"></span>
    <strong>Agent Society</strong>
    <span id="exp-id" class="muted"></span>
    <span id="mode-badge" class="badge"></span>
  </div>
  <div class="stats">
    <div class="stat"><span class="k">phase</span><span class="v" id="phase">—</span></div>
    <div class="stat"><span class="k">time left</span><span class="v" id="clock">—</span></div>
    <div class="stat"><span class="k">agents</span><span class="v" id="n-agents">0</span></div>
    <div class="stat"><span class="k">teams</span><span class="v" id="n-teams">0</span></div>
    <div class="stat"><span class="k">projects</span><span class="v" id="n-projects">0</span></div>
    <div class="stat"><span class="k">spent</span><span class="v" id="spent">$0.00</span></div>
    <div class="stat"><span class="k">messages</span><span class="v" id="n-msgs">0</span></div>
  </div>
  <div class="controls">
    <button id="btn-end" class="danger" title="End the experiment now and start judging">End &amp; judge</button>
  </div>
</header>
<main>
  <section id="graph-wrap">
    <svg id="graph"></svg>
    <div id="legend">
      <span><i class="sw idle"></i>idle</span><span><i class="sw running"></i>thinking</span><span><i class="sw provisioning"></i>provisioning</span><span><i class="sw exhausted"></i>out of budget</span><span><i class="sw terminated"></i>terminated</span>
      <span><i class="ln parent"></i>parent → child</span><span><i class="ln team"></i>team</span><span><i class="ln msg"></i>message</span>
    </div>
    <div id="replay">
      <button id="btn-live">LIVE</button>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <span id="scrub-time" class="muted"></span>
    </div>
  </section>
  <aside id="side">
    <nav class="tabs">
      <button data-tab="timeline" class="active">Timeline</button>
      <button data-tab="agent">Agent</button>
      <button data-tab="projects">Projects</button>
      <button data-tab="teams">Teams</button>
    </nav>
    <div class="tab" id="tab-timeline">
      <div class="filters">
        <label><input type="checkbox" id="f-activity"> show activity</label>
        <label><input type="checkbox" id="f-spend"> show spend</label>
      </div>
      <ol id="timeline"></ol>
    </div>
    <div class="tab hidden" id="tab-agent"><div id="agent-detail" class="muted">Click an agent node.</div></div>
    <div class="tab hidden" id="tab-projects"><div id="projects"></div></div>
    <div class="tab hidden" id="tab-teams"><div id="teams"></div></div>
  </aside>
</main>
<script src="/d3.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
